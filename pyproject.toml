[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafford"
version = "1.0.0"
description = "Professional WiFi Auditing Framework — modern TUI, plugin-extensible, multi-language"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
authors = [
    {name = "Wafford Team", email = "dev@wafford.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "InquirerPy>=0.3.4",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "packaging>=24.0",
    "click>=8.1.7",
    "cryptography>=42.0.0",
    "mac-vendor-lookup>=0.1.2",
    "pexpect>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
wafford = "wafford.__main__:main"

[project.urls]
Homepage = "https://wafford.io"
Repository = "https://github.com/wafford/wafford"
Issues = "https://github.com/wafford/wafford/issues"
Documentation = "https://docs.wafford.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "S603", "S607", "COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["wafford"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"

[tool.black]
target-version = ["py312"]
line-length = 100
